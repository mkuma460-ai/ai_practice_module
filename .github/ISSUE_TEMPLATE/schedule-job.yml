name: "Schedule Linux Job"
description: "Request a scheduled job on the Linux server. Fill in the fields below with the job details. Use cron for recurring jobs or 'One-time' for a single scheduled run."
title: "[Schedule Job] {{job_name}}"
labels:
  - infra
  - scheduled-job
body:
  - type: input
    id: job_name
    attributes:
      label: "Job name"
      description: "Short identifier for the job (no spaces recommended)."
      placeholder: "nightly-backup"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Job description"
      description: "What the job does and why it's needed."
      placeholder: "Backs up the Postgres DB to /backups every night."
    validations:
      required: true

  - type: input
    id: requester
    attributes:
      label: "Requested by (GitHub user or team)"
      description: "Who is requesting this job."
      placeholder: "@team-ops"
    validations:
      required: true

  - type: dropdown
    id: schedule_type
    attributes:
      label: "Schedule type"
      description: "Choose whether this is recurring (cron) or one-time."
      options:
        - label: "Cron (recurring)"
        - label: "One-time (at/date)"
    validations:
      required: true

  - type: input
    id: cron_expression
    attributes:
      label: "Cron expression"
      description: "If using cron, provide the cron expression (min hour day month weekday). Leave blank for one-time jobs."
      placeholder: "0 2 * * *"

  - type: input
    id: at_time
    attributes:
      label: "Run at (one-time)"
      description: "If one-time, provide date/time in UTC (YYYY-MM-DD HH:MM). Leave blank for recurring jobs."
      placeholder: "2026-05-28 03:00"

  - type: textarea
    id: command
    attributes:
      label: "Command or script to run"
      description: "Full command or absolute script path to execute on the server."
      placeholder: "bash /opt/scripts/backup.sh --full"
    validations:
      required: true

  - type: input
    id: run_as
    attributes:
      label: "Run as user"
      description: "Linux user account that should run this job."
      placeholder: "root"
    validations:
      required: true

  - type: input
    id: working_directory
    attributes:
      label: "Working directory (optional)"
      description: "Directory to cd into before running the command."
      placeholder: "/var/www/app"

  - type: textarea
    id: env_vars
    attributes:
      label: "Environment variables (optional)"
      description: "One per line, e.g. KEY=value"

  - type: input
    id: notify_emails
    attributes:
      label: "Notification email(s) (optional)"
      description: "Comma-separated emails to notify on failure/success."
      placeholder: "ops@example.com,admin@example.com"

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - label: "Low"
        - label: "Medium"
        - label: "High"

  - type: input
    id: estimated_runtime
    attributes:
      label: "Estimated runtime (minutes, optional)"
      placeholder: "e.g. 30"

  - type: checkboxes
    id: approvals
    attributes:
      label: "Safety checks"
      description: "Confirm the items below before submitting."
      options:
        - label: "I confirm the script/command has been code-reviewed and is safe to run"
        - label: "I have provided any required credentials or secrets via the secure vault as instructed"
    validations:
      required: true

  - type: textarea
    id: additional_notes
    attributes:
      label: "Additional notes (optional)"
      description: "Any other context, log paths, or rollback instructions."
